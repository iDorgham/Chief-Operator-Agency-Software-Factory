name: Validate factory

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    # validate-factory.ps1 uses Windows path separators, and the archive
    # SHA256SUMS were generated on a Windows (core.autocrlf=true) checkout.
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # The archive check reads files from baseline commit e31ed81.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install validator dependencies
        run: python -m pip install -r scripts/requirements.txt

      # Skill frontmatter is checked by scripts/validate_contracts.py. The
      # optional -SkillValidator (Codex quick_validate.py) is local-only.
      - name: Run factory validation
        shell: pwsh
        run: ./scripts/validate-factory.ps1
